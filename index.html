<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tobu TEG Navigator</title>
    <style>
      :root {
        color-scheme: light;
        --slate-950: #020617;
        --slate-900: #0f172a;
        --slate-800: #1e293b;
        --slate-700: #334155;
        --slate-600: #475569;
        --slate-500: #64748b;
        --slate-300: #cbd5e1;
        --slate-200: #e2e8f0;
        --slate-100: #f1f5f9;
        --sky-700: #0369a1;
        --sky-100: #e0f2fe;
        --sky-50: #f0f9ff;
        --sky-300: #7dd3fc;
        --emerald-700: #047857;
        --emerald-100: #d1fae5;
        --emerald-50: #ecfdf5;
        --emerald-300: #6ee7b7;
        --red-50: #fef2f2;
        --red-300: #fca5a5;
        --red-950: #450a0a;
        --amber-50: #fffbeb;
        --amber-300: #fcd34d;
        --amber-950: #451a03;
        --white: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 50% -14%, rgba(14, 165, 233, .12), transparent 28rem),
          linear-gradient(180deg, #030712 0, #07111f 15rem, #090f1a 100%);
        color: #e5eefb;
      }
      button, input { font: inherit; }
      button { cursor: pointer; border: 0; }
      .wrap { width: 100%; max-width: 30rem; min-height: 100vh; margin: 0 auto; padding: 1.25rem 1rem; }
      .home { display: flex; flex-direction: column; padding-top: 1.5rem; }
      .muted { color: var(--slate-600); }
      .eyebrow { color: #8ea8c8; font-size: .875rem; font-weight: 700; }
      h1 { margin: .5rem 0 0; font-size: 2rem; line-height: 1.15; letter-spacing: .01em; }
      .home h1 { font-size: 2.5rem; }
      p { margin: 0; }
      .stack { display: grid; gap: 1rem; }
      .mt2 { margin-top: .5rem; }
      .mt3 { margin-top: .75rem; }
      .mt4 { margin-top: 1rem; }
      .mt5 { margin-top: 1.25rem; }
      .mt8 { margin-top: 2rem; }
      .primary-btn {
        min-height: 5rem;
        border-radius: .75rem;
        padding: 1rem 1.25rem;
        text-align: left;
        font-size: 1.25rem;
        font-weight: 800;
        color: white;
        box-shadow: 0 14px 28px rgba(15, 23, 42, .16);
      }
      .btn-gh { background: linear-gradient(135deg, #075985, #0284c7); }
      .btn-pm { background: linear-gradient(135deg, #065f46, #059669); }
      .btn-dark {
        background: linear-gradient(135deg, #f8fafc, #dbeafe);
        color: #08111f;
        border: 1px solid rgba(255, 255, 255, .9);
      }
      .btn-dark::after {
        content: "推奨モードを確認";
        display: block;
        margin-top: .35rem;
        font-size: .875rem;
        font-weight: 800;
        color: #475569;
      }
      .back {
        min-height: 2.75rem;
        padding: 0 .75rem;
        border-radius: .625rem;
        color: #cbd5e1;
        background: rgba(255,255,255,.08);
        font-weight: 700;
      }
      .back:active { background: rgba(255,255,255,.16); }
      .card {
        border: 1px solid rgba(148, 163, 184, .24);
        background: rgba(10, 16, 28, .82);
        border-radius: .875rem;
        padding: 1rem;
        box-shadow: 0 12px 28px rgba(15, 23, 42, .08);
        backdrop-filter: blur(10px);
      }
      .safety { color: #cbd5e1; }
      .safety strong { color: #f8fafc; }
      .choice {
        min-height: 4rem;
        padding: .875rem 1rem;
        border-radius: .875rem;
        border: 1px solid rgba(148, 163, 184, .24);
        background: rgba(10, 16, 28, .78);
        color: #e5eefb;
        text-align: left;
        font-weight: 800;
        box-shadow: 0 8px 18px rgba(15, 23, 42, .06);
      }
      .choice.selected { border-color: var(--slate-900); background: var(--slate-900); color: white; }
      .choice small { display: block; margin-top: .2rem; color: #94a3b8; font-size: .8rem; font-weight: 800; }
      .choice.selected small { color: #cbd5e1; }
      .utility-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
      .utility-btn {
        min-height: 4.25rem;
        border-radius: .875rem;
        padding: .85rem;
        border: 1px solid rgba(148, 163, 184, .28);
        background: rgba(10, 16, 28, .78);
        color: #e5eefb;
        text-align: left;
        font-weight: 900;
        box-shadow: 0 8px 18px rgba(15, 23, 42, .08);
      }
      .utility-btn small { display: block; margin-top: .25rem; color: #94a3b8; font-size: .78rem; font-weight: 800; }
      .tube {
        border-width: 2px;
        border-style: solid;
        border-radius: .875rem;
        padding: 1rem;
        box-shadow: 0 14px 28px rgba(15, 23, 42, .1);
      }
      .tube.gh { border-color: var(--sky-300); background: #dff1ff; color: var(--slate-950); }
      .tube.pm { border-color: var(--emerald-300); background: #ddf7ec; color: var(--slate-950); }
      .tube-row { display: flex; align-items: center; gap: 1rem; }
      .tube svg { width: 4rem; height: 6.5rem; flex: 0 0 auto; }
      .tube-title { font-size: 1.5rem; font-weight: 900; }
      .tube .formal { margin-top: .25rem; font-size: 1.125rem; font-weight: 800; }
      .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
      .chip { border-radius: .25rem; padding: .25rem .5rem; font-size: .875rem; font-weight: 800; background: white; color: var(--slate-700); }
      .chip.gh { background: var(--sky-100); color: #075985; }
      .chip.pm { background: var(--emerald-100); color: #065f46; }
      .tube-sentence { margin-top: .75rem; font-weight: 800; color: var(--slate-900); }
      .seg { display: grid; gap: .25rem; padding: .25rem; border-radius: .875rem; background: rgba(203, 213, 225, .76); }
      .seg.two { grid-template-columns: 1fr 1fr; }
      .seg.three { grid-template-columns: 1fr 1fr 1fr; }
      .seg button { min-height: 3rem; border-radius: .625rem; background: transparent; color: var(--slate-700); font-weight: 900; }
      .seg button.active { background: white; color: var(--slate-950); box-shadow: 0 1px 2px rgba(15, 23, 42, .12); }
      label.input-card { display: block; }
      .label-line { display: flex; justify-content: space-between; gap: .75rem; font-size: 1.125rem; font-weight: 900; }
      .input-row { display: flex; align-items: center; gap: .75rem; margin-top: .75rem; }
      input {
        min-height: 3.5rem;
        min-width: 0;
        width: 100%;
        border-radius: .625rem;
        border: 1px solid var(--slate-300);
        background: #f8fafc;
        padding: 0 .75rem;
        font-size: 1.5rem;
        font-weight: 900;
        color: var(--slate-950);
      }
      input:focus { outline: none; border-color: var(--slate-900); background: white; }
      .unit { width: 3rem; flex: 0 0 auto; font-size: 1.125rem; font-weight: 900; color: var(--slate-700); }
      .submit { width: 100%; min-height: 4rem; border-radius: .875rem; background: linear-gradient(135deg, #0f172a, #22314a); color: white; font-size: 1.25rem; font-weight: 900; box-shadow: 0 14px 28px rgba(15, 23, 42, .16); }
      .result-card { border-radius: .875rem; border: 1px solid; padding: 1rem; box-shadow: 0 12px 28px rgba(15, 23, 42, .08); }
      .hero-panel { color: #f8fafc; }
      .hero-panel .eyebrow, .hero-panel .muted { color: #a9bed8; }
      .hero-panel h1 { color: #f8fafc; }
      .mode-pill {
        display: inline-flex;
        align-items: center;
        min-height: 2rem;
        border-radius: 999px;
        padding: .25rem .75rem;
        background: rgba(14, 165, 233, .14);
        color: #bde4ff;
        font-weight: 900;
        font-size: .875rem;
      }
      .notice-card {
        border-radius: .875rem;
        border: 1px solid var(--amber-300);
        background: var(--amber-50);
        color: var(--amber-950);
        padding: 1rem;
        font-weight: 800;
        line-height: 1.65;
      }
      .inline-highlight {
        display: inline;
        border-radius: .25rem;
        background: #fde68a;
        padding: .05rem .25rem;
        font-weight: 900;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      .red { border-color: var(--red-300); background: var(--red-50); color: var(--red-950); }
      .red.urgent { border-width: 2px; border-color: #dc2626; background: #fee2e2; box-shadow: 0 0 0 3px rgba(248, 113, 113, .45), 0 16px 34px rgba(127, 29, 29, .24); }
      .yellow { border-color: var(--amber-300); background: var(--amber-50); color: var(--amber-950); }
      .green { border-color: var(--emerald-300); background: var(--emerald-50); color: #022c22; }
      .gray { border-color: var(--slate-300); background: var(--slate-100); color: var(--slate-800); }
      .result-card h2 { margin: 0; font-size: 1.125rem; }
      .info-list { display: grid; gap: .75rem; }
      .info-item {
        border-radius: .875rem;
        border: 1px solid rgba(148, 163, 184, .24);
        background: rgba(10, 16, 28, .78);
        padding: 1rem;
        color: #dbeafe;
      }
      .info-item h2 { margin: 0; color: #f8fafc; font-size: 1.15rem; }
      .info-item p { margin-top: .5rem; color: #cbd5e1; }
      .tag-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; }
      .tag { border-radius: 999px; padding: .25rem .65rem; background: rgba(14, 165, 233, .14); color: #bde4ff; font-size: .8rem; font-weight: 900; }
      .protocol-image {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, .28);
        border-radius: .875rem;
        background: rgba(10, 16, 28, .78);
        box-shadow: 0 14px 28px rgba(15, 23, 42, .18);
      }
      .image-scroll {
        display: block;
        overflow-x: auto;
        border-radius: .875rem;
      }
      .image-scroll img {
        display: block;
        margin: 0 auto;
        min-width: 42rem;
        max-width: none;
      }
      .inline-note {
        border-radius: .875rem;
        border: 1px solid rgba(148, 163, 184, .28);
        background: rgba(10, 16, 28, .78);
        padding: 1rem;
        color: #dbeafe;
      }
      .inline-note h2 { margin: 0; color: #f8fafc; font-size: 1rem; }
      .inline-note p { margin-top: .5rem; color: #cbd5e1; line-height: 1.65; }
      dl { margin: .75rem 0 0; display: grid; gap: .5rem; }
      dt { font-size: .875rem; font-weight: 900; opacity: .75; }
      dd { margin: .25rem 0 0; }
      footer { margin-top: auto; padding: 1.5rem 0; text-align: center; font-size: .75rem; color: var(--slate-500); }
    </style>
  </head>

        else r.push(card("ecmo-ckr-ng","red",v.ckR > 24 ? "【異常】抗凝固過多" : "【異常】抗凝固不足",v.ckR > 24 ? "抗凝固過多の可能性があります。" : "抗凝固不足の可能性があります。",v.ckR > 24 ? "ヘパリン減量を検討します。" : "ヘパリン増量を検討します。",`CK-R ${v.ckR} min`,"検討"));
        if (v.ckhR === undefined) r.push(un("ecmo-ckhr-un","CKH-R"));
        else if (v.ckhR > 16) r.push(card("ecmo-ckhr-red","red","【異常】凝固因子不足","凝固因子不足を疑います。","出血所見、凝固検査、フィブリノゲン値と合わせてFFP補充を検討します。",`CKH-R ${v.ckhR} min`,"検討"));
        else if (v.ckhR > 10) r.push(card("ecmo-ckhr-yellow","yellow","【要判断】CKH-R軽度延長","軽度〜中等度の凝固因子低下の可能性があります。","出血傾向がなければ補正なしも検討します。出血時はFFP補正を検討します。",`CKH-R ${v.ckhR} min`,"Expert opinion / 参考"));
        if (v.ckR !== undefined && v.ckhR > 0 && v.ckR / v.ckhR > 2) r.push(card("ecmo-ratio","yellow","【要判断】ヘパリン影響","ヘパリン影響が強い可能性があります。","APTT、ACT、出血・回路所見と合わせてヘパリン調整を検討します。",`CK-R / CKH-R ${(v.ckR / v.ckhR).toFixed(2)}`,"検討"));
        if (v.cffMa !== undefined && v.cffMa < 15) {
          if (v.fib === undefined) {
            r.push(card("ecmo-cff-low-fib-un","yellow","【要判断】CFF-MA低値","CFF-MA低値です。フィブリノゲン低下または凝集能低下の可能性があります。","フィブリノゲン実測値を確認してください。Fib >150 mg/dLなら第XIII因子欠乏を示唆する可能性、Fib <150 mg/dLならFFP補充を検討します。",`CFF-MA ${v.cffMa} mm、Fib 未入力`,"Expert opinion / 参考"));
          } else if (v.fib > 150) {
            r.push(card("ecmo-cff-low-fib-high","yellow","【要判断】第XIII因子欠乏の可能性","CFF-MA低値ですが、フィブリノゲン値は150 mg/dLを超えています。第XIII因子欠乏を示唆する可能性があります。","出血所見、LY30、通常凝固検査、院内プロトコールと合わせて評価してください。",`CFF-MA ${v.cffMa} mm、Fib ${v.fib} mg/dL`,"Expert opinion / 参考"));
          } else if (v.fib < 150) {
            r.push(card("ecmo-cff-low-fib-low","red","【異常】フィブリノゲン低下","CFF-MA低値かつフィブリノゲン値150 mg/dL未満です。フィブリノゲン不足を疑います。","出血所見、凝固検査と合わせてFFP補充を検討します。",`CFF-MA ${v.cffMa} mm、Fib ${v.fib} mg/dL`,"検討"));
          } else {
            r.push(card("ecmo-cff-low-fib-border","yellow","【要判断】CFF-MA低値","CFF-MA低値で、フィブリノゲン値は150 mg/dLです。境界値として扱います。","出血所見、LY30、通常凝固検査と合わせて評価してください。",`CFF-MA ${v.cffMa} mm、Fib ${v.fib} mg/dL`,"Expert opinion / 参考"));
          }
        }
        if ((v.crtMa !== undefined && v.crtMa >= 70) || (v.cffMa !== undefined && v.cffMa >= 35)) r.push(card("ecmo-ma","yellow","【要判断】MA高値","過凝固・炎症・感染兆候の可能性があります。","感染、炎症、血栓リスク、回路所見を確認してください。",`CRT-MA ${v.crtMa ?? "未入力"} mm、CFF-MA ${v.cffMa ?? "未入力"} mm`,"Expert opinion / 参考"));
        else if (v.crtMa === undefined && v.cffMa === undefined) r.push(un("ecmo-ma-un","MA高値"));
        return sort(r);
      }
      function interpretPm(v, ctx) {
        const r = [];
        if (ctx === "trauma") r.push(card("tbi-note","yellow","【要判断】頭部外傷と血小板機能",'<span class="inline-highlight">特に頭部外傷では抗血小板薬内服なしでも血小板機能抑制を来すことがあります。</span>',"血小板数に関わらず、血小板機能抑制があれば血小板輸血を検討してください。","","Expert opinion / 参考"));
        if (v.actfMa === undefined) r.push(un("actf-un","ActF-MA"));
        else if (v.actfMa < 5) r.push(card("actf-low","red","【異常】フィブリノゲン低下","フィブリノゲン不足または凝集能低下を疑います。","Fib 3g投与を検討します。",`入力値 ActF-MA ${v.actfMa} mm`,"検討","基準値 ActF-MA 5 mm以上 / Fib近似 4.5 mm≒150mg/dL、10.5 mm≒200mg/dL"));
        else r.push(card("actf-ok","green","【範囲内】ActF-MA",v.actfMa >= 10.5 ? "Fib 200mg/dL相当以上の目安です。" : "Fib 150mg/dL相当以上の目安です。","実測フィブリノゲン値、出血所見と合わせて判断してください。",`入力値 ActF-MA ${v.actfMa} mm`,"参考","基準値 ActF-MA 5 mm以上 / Fib近似 4.5 mm≒150mg/dL、10.5 mm≒200mg/dL"));
        if (v.hkhMa === undefined) r.push(un("hkhma-un","HKH-MA"));
        else if (v.hkhMa < 45) r.push(card("hkhma-low","red","【異常】血餅強度低下","全体の血餅強度低下を疑います。","血小板輸血を検討します。",`入力値 HKH-MA ${v.hkhMa} mm`,"検討","基準値 HKH-MA 45 mm以上"));
        else r.push(card("hkhma-ok","green","【範囲内】HKH-MA","全体の血餅強度は目標範囲内の目安です。","臨床所見と合わせて判断してください。",`入力値 HKH-MA ${v.hkhMa} mm`,"参考","基準値 HKH-MA 45 mm以上"));
        if (v.adpInhibition === undefined) r.push(un("adp-un","ADP inhibition"));
        else if (v.adpInhibition > 60) r.push(card("adp-high","red","【異常】ADP系血小板機能抑制","ADP系血小板機能抑制を疑います。","血小板輸血を検討します。",`入力値 ADP inhibition ${v.adpInhibition}%`,"検討","基準値 ADP inhibition 60%以下"));
        else r.push(card("adp-ok","green","【範囲内】ADP inhibition","外傷TTPの重要閾値は超えていません。","ADP-MA、血小板数、出血所見と合わせて判断してください。",`入力値 ADP inhibition ${v.adpInhibition}%`,"参考","基準値 ADP inhibition 60%以下"));
        if (ctx === "antiplatelet") {
          if (v.aaInhibition === undefined) r.push(un("aa-un","AA inhibition"));
          else if (v.aaInhibition > 30) r.push(card("aa-high","yellow","【要判断】アスピリン効果","AA系抑制あり。アスピリン効果の可能性があります。","アスピリンの効果を見る場合は、採血後30分待ってから測定した値か確認してください。処置延期、方法変更、血小板輸血を臨床状況に応じて検討します。",`AA inhibition ${v.aaInhibition}%`,"参考"));
          else r.push(card("aa-ok","green","【範囲内】AA inhibition","AA inhibitionは30%以下です。抗血小板薬効果は強くない可能性があります。","薬剤歴、出血所見、処置リスクと合わせて判断してください。",`AA inhibition ${v.aaInhibition}%`));
        }
        if (v.hkhR === undefined) r.push(un("hkhr-un","HKH-R"));
        else if (v.hkhR > 10) r.push(card("hkhr-high","yellow","【要判断】HKH-R延長","凝固因子不足の可能性を参考所見として表示します。","出血量、重症度、通常凝固検査、術野所見と合わせてFFPを検討します。HKH-R単独でFFP判断を強く推奨しません。",`入力値 HKH-R ${v.hkhR} min`,"Expert opinion / 参考","参考基準 HKH-R 10 min以下"));
        else r.push(card("hkhr-ok","green","【範囲内】HKH-R","HKH-Rは10分以内です。ただしPMのR時間は確立閾値ではありません。","他の項目と臨床所見を確認してください。",`入力値 HKH-R ${v.hkhR} min`,"参考","参考基準 HKH-R 10 min以下"));
        if (v.adpMa === undefined) r.push(un("adpma-un","ADP-MA"));
        else if (v.adpMa <= 20) r.push(card("adpma-vlow","yellow","【要判断】ADP-MA著明低値","ADP系血小板機能低下が強い可能性があります。","血小板輸血を検討します。",`入力値 ADP-MA ${v.adpMa} mm`,"Expert opinion / 検討","参考基準 ADP-MA 20 mm超"));
        else if (v.adpMa <= 40) r.push(card("adpma-low","yellow","【要判断】ADP-MA低値","ADP系血小板機能低下の可能性があります。","血小板機能低下を疑い、血小板輸血を検討します。",`入力値 ADP-MA ${v.adpMa} mm`,"Expert opinion / 参考","参考基準 ADP-MA 40 mm超"));
        else r.push(card("adpma-ok","green","【範囲内】ADP-MA","ADP-MAは参考低値閾値を下回っていません。","ADP inhibition、血小板数、出血所見と合わせて判断してください。",`ADP-MA ${v.adpMa} mm`));
        if (ctx === "antiplatelet") {
          if (v.aaMa === undefined) r.push(un("aama-un","AA-MA"));
          else r.push(card("aama-ref","yellow","【要判断】AA-MA参考値","AA-MAは参考値として表示します。","AA inhibition、アスピリン内服歴、採血後30分待って測定した値かを確認してください。",`AA-MA ${v.aaMa} mm`,"Expert opinion / 参考"));
        }
        if (ctx === "antiplatelet") {
          if (v.adpInhibition > 30) r.push(card("ap-adp","yellow","【要判断】P2Y12阻害薬効果","P2Y12阻害薬効果の可能性があります。","クロピドグレル、プラスグレル、チカグレロルなどの影響を検討します。",`入力値 ADP inhibition ${v.adpInhibition}%`,"参考","参考基準 ADP inhibition 30%以下"));
        }
        if (v.hkhR < 10 && v.hkhMa >= 45 && v.adpInhibition < 60 && v.actfMa >= 5) r.push(card("mtp","yellow","【要判断】MTP de-escalation候補","TEG上は凝固・血小板機能の立ち上がりがあります。","出血所見・バイタル・止血状況と合わせてMTP減量/終了を検討します。自動終了してよいという意味ではありません。","","Expert opinion / 検討"));
        return sort(r);
      }
      function warningsGh(v) {
        const w = [];
        if (v.ckR > 70) w.push("CK-R: flat line相当の可能性があります。TEG画面を確認してください。");
        if (v.ckhR > 70) w.push("CKH-R: flat line相当の可能性があります。TEG画面を確認してください。");
        if (v.crtMa > 90) w.push("CRT-MA: 明らかに高い値です。入力値を確認してください。");
        if (v.cffMa > 60) w.push("CFF-MA: 明らかに高い値です。入力値を確認してください。");
        if (v.ly30 > 100) w.push("LY30: LY30は%表示です。入力値を確認してください。");
        return w;
      }
      function warningsPm(v) {
        const w = [];
        if (v.adpInhibition > 100) w.push("ADP inhibition: Inhibitionは0〜100%で入力してください。");
        if (v.aaInhibition > 100) w.push("AA inhibition: Inhibitionは0〜100%で入力してください。");
        if (v.hkhR > 70) w.push("HKH-R: flat line相当の可能性があります。TEG画面を確認してください。");
        return w;
      }
      function renderResult() {
        app.innerHTML = `<main class="wrap">
          <div><button class="back" id="back">入力へ戻る</button><button class="back" id="home">トップ</button></div>
          <h1>${resultState.title}</h1>
          ${enteredSummary(resultState.values, resultState.labels)}
          <section class="stack mt4">${renderResultCards()}</section>
          ${ecmoNotice()}
          <div class="mt5">${safety()}</div>${footer()}</main>`;
        byId("back").onclick = () => setScreen(resultState.previous);
        byId("home").onclick = () => setScreen("home");
      }
      function ecmoNotice() {
        if (resultState.title !== "TEG GH ECMO解釈") return "";
        return `<section class="inline-note mt5"><h2>ECMO中TEG GHの注意</h2><p>TEG GHはAPTT/ACTの代替ではなく補助指標です。回路所見、出血所見、血栓所見、通常凝固検査と合わせて判断してください。</p></section>`;
      }
      function renderResultCards() {
        const ordered = [...resultState.results].sort((a, b) => rank[a.severity] - rank[b.severity]);
        const cardHtml = r => {
          const urgent = resultState.title === "TEG PM 外傷TTP解釈" && r.severity === "red" ? " urgent" : "";
          const rationale = [r.referenceRange, r.rationale].filter(Boolean).join("<br>");
          return `<article class="result-card ${r.severity}${urgent}"><h2>${r.title}</h2><dl><div><dt>判定</dt><dd>${r.assessment}</dd></div>${rationale ? `<div><dt>根拠</dt><dd>${rationale}</dd></div>` : ""}<div><dt>次に検討</dt><dd><strong>${r.action}</strong></dd></div><div><dt>文言強度</dt><dd>${r.strength}</dd></div></dl></article>`;
        };
        const red = ordered.filter(r => r.severity === "red").map(cardHtml).join("");
        const warning = resultState.warnings.length ? `<section class="result-card yellow">${resultState.warnings.map(w => `<p>${w}</p>`).join("")}</section>` : "";
        const rest = ordered.filter(r => r.severity !== "red").map(cardHtml).join("");
        return red + warning + rest;
      }
      render();
    </script>
  </body>
